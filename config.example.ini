[general]
; dry_run = true 时只打印邮件内容不发送(调试用),正式运行为 false
dry_run = false
seen_file = seen_ids.json
log_file = monitor.log

[filter]
; 标书编号匹配规则(正则)。auto = 自动匹配当年及上一年的 /C/YY 结尾(免跨年维护, 推荐)
; 也可写死, 如 /C/26$
tender_no_pattern = auto

[smtp]
; 腾讯企业邮箱(exmail): host=smtp.exmail.qq.com, port=465
; QQ邮箱: smtp.qq.com; 163: smtp.163.com; Gmail: smtp.gmail.com
; 密码推荐用环境变量 SMTP_PASSWORD 传入(优先级高于下面的 password), 避免明文落盘
host = smtp.exmail.qq.com
port = 465
use_ssl = true
user = your_email@example.com
password = 在此填SMTP客户端专用密码/授权码
mail_from = your_email@example.com
; 多个收件人用英文逗号分隔
mail_to = receiver@example.com
